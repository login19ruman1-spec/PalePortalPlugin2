# =========================================================
#  PalePortal - конфигурация
# =========================================================

# Мир, в котором находится рамка древнего города
portal-world: world

# Углы рамки древнего города (reinforced_deepslate).
# Укажи любые два противоположных угла внешнего контура рамки -
# плагин сам определит минимальные/максимальные координаты
# и вычислит внутреннюю зону портала.
# Самый простой способ получить эти координаты - встать в углах
# рамки и использовать команду /paleportal setportal (нужно 2 раза:
# один раз встав в первом углу, второй раз - во втором; плагин
# запомнит обе точки по очереди).
portal-frame:
  corner1:
    x: 0
    y: 64
    z: 0
  corner2:
    x: 0
    y: 68
    z: 3

# Материал блоков портала внутри рамки
portal-glass-material: LIGHT_BLUE_STAINED_GLASS   # или BLUE_STAINED_GLASS

# Материал самой рамки (обычно не меняется)
portal-frame-material: REINFORCED_DEEPSLATE

# Частицы внутри портала (каждые 5 тиков)
portal-particles:
  enabled: true
  period-ticks: 5

# Музыкальные блоки перед порталом (ровно 5 штук, по порядку мелодии).
# Каждый должен находиться в радиусе <music-radius> блоков от центра рамки.
music-radius: 10

music-blocks:
  - world: world
    x: 0
    y: 64
    z: 10
  - world: world
    x: 0
    y: 64
    z: 9
  - world: world
    x: 0
    y: 64
    z: 8
  - world: world
    x: 0
    y: 64
    z: 7
  - world: world
    x: 0
    y: 64
    z: 6

# Мелодия: ID нот (0-24) в NotePlayEvent#getNote()#getId().
# По умолчанию: F# (6), A (10), C# (13), A (10), F# (6)
# Нота[i] должна быть сыграна именно на music-blocks[i].
melody:
  - 6
  - 10
  - 13
  - 10
  - 6

# Время (в секундах), за которое игрок должен сыграть всю мелодию
melody-time-limit-seconds: 30

# ---------------------------------------------------------
#  Мир "Бледный лес" (pale_forest)
# ---------------------------------------------------------
pale-forest:
  world-name: pale_forest
  # Точка входа (куда телепортируется игрок из портала)
  entry:
    x: 0.5
    y: 65
    z: 0.5
    yaw: 0
    pitch: 0
  effects:
    night-vision: true
    darkness-enabled: true
    darkness-amplifier: 0
  # Шанс (0.0-1.0) редкого водоёма на чанк при генерации
  pond-chance: 0.03
  # Плотность бледных дубов (0.0-1.0) - шанс дерева на подходящую колонну
  tree-chance: 0.015

# ---------------------------------------------------------
#  Скрипуны (Creaking)
# ---------------------------------------------------------
creakings:
  # Включить периодический автоспавн
  auto-spawn-enabled: true
  auto-spawn-period-minutes: 5
  # Радиус спавна вокруг точки входа в pale_forest
  spawn-radius: 50
  # Минимальное расстояние от любого игрока при спавне
  min-distance-to-player: 10
  # Максимальное количество одновременно живых скрипунов, заспавненных плагином
  max-alive: 12

  normal:
    health: 20.0
    damage: 4.0
  smart:
    health: 30.0
    damage: 8.0
  kind:
    health: 15.0
    damage: 0.0
  ancient:
    health: 50.0
    damage: 6.0
    speed: 0.15
    aggro-radius: 10.0

# ---------------------------------------------------------
#  Логирование
# ---------------------------------------------------------
logging:
  log-activations: true
